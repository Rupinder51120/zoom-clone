name: CI and deployment

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Railway and Vercel after checks pass (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - name: Generate Next.js types for a clean checkout
        run: npx next typegen
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r requirements.lock.txt ruff==0.16.10
      - run: ruff check app migrations ci
      - run: ruff format --check app migrations ci
      - name: Verify migrations and API on a disposable SQLite database
        run: python ci/verify.py

  deploy:
    name: Production deployment
    needs: [frontend, backend]
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.ENABLE_PRODUCTION_DEPLOYMENTS == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
