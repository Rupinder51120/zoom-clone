services:
  - type: web
    name: zoom-meeting-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    disk:
      name: meeting-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/zoom.db
      - key: HOST_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ICE_SERVERS_JSON
        sync: false
